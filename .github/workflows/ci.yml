name: CI

# Kept small: main and pull requests only, and a newer run on the same ref cancels the
# older one. The lockstep gate needs the reference and ROMs, so it runs locally
# (README, "Reproducing"); here `cargo test` replays the example cartridges against
# the reference's committed traces.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
